name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # ai-platform, at platform/: the protocols
      # uv, then Python as .python-version says. Pinned by commit, as setup-uv asks: it
      # publishes no major tag.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Install, exactly as uv.lock has it
        run: uv sync --locked
      - name: Lint
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked lint-imports
      - name: Test
        run: uv run --locked pytest
