# The cloud's configuration, shared by every environment (docs/decisions/0002-stack.md).
#
# An environment's file (environments/<name>.toml) changes what it needs on top, then a
# git-ignored local.toml, for one machine. Every value is required and is checked when a
# process starts. Secrets never come from these files: they come from the environment,
# or the deployment's secret store.

[api]
# The address the api process listens on: this machine only, unless an environment
# needs more.
host = "127.0.0.1"
# Its port, behind the reverse proxy.
port = 8000
# Whether it logs each request. The reverse proxy logs them already.
access_log = false
# The proxies whose X-Forwarded-For names the client: the reverse proxy in front of the
# api, by address or network. Rate limits count by the address it gives, so it must be
# listed, or every request would count as the proxy's own.
forwarded_allow_ips = ["127.0.0.1", "::1"]
# Bytes a request's body may have at most. The app API's largest is an ID token with
# Apple's code, some 10 KB.
max_body_size = 65536
# Seconds the api waits, as it stops, for its requests and connections to end once its
# devices were asked to connect again, before it cancels what is left. Without a bound, a
# device that reads nothing would hold the stop without end: its connection never closes.
# After [devices.link] close_timeout, it leaves room within the 10 s that Docker Compose
# waits for a container to stop before it kills it (stop_grace_period).
shutdown_timeout = 3

[logging]
# The least severe records kept: DEBUG, INFO, WARNING or ERROR.
level = "INFO"
# json: an object per line, for the machine that collects the logs; text: for a person.
format = "json"

[database]
# PostgreSQL (docs/decisions/0008-data-and-tokens.md). Its URL is a secret:
# AI_CLOUD_DATABASE_URL.
#
# Connections each process keeps open.
pool_size = 5
# Connections it may open beyond those, when they are all busy.
max_overflow = 5
# Seconds a request waits for a free connection before it fails.
pool_timeout = 10
# Seconds to open a connection.
connect_timeout = 10
# Seconds a statement may run before it is cancelled.
command_timeout = 30

[redis]
# Redis, for what may be lost: nonces, rate limits, the events' streams. Its URL is a
# secret: AI_CLOUD_REDIS_URL.
#
# Seconds to open a connection.
connect_timeout = 5
# Seconds to wait for an answer.
timeout = 5
# Connections each process may keep open.
max_connections = 50

[tokens]
# The cloud's own tokens: people's sessions, and devices' access tokens. Their keys are
# a secret: AI_CLOUD_SIGNING_KEYS.
#
# The issuer the cloud names in them (their iss). Only the cloud reads it.
issuer = "ai-cloud"
# Seconds by which clocks may disagree when a token's times are checked: the cloud's,
# the providers' whose ID tokens it reads, and the devices' whose assertions it reads.
leeway = 30

[events]
# Domain events (docs/decisions/0009-domain-events.md): the worker relays each module's
# outbox to its stream in Redis, and hands the events to the consumers.
#
# Seconds between two looks at the outboxes while they are empty: the longest an event
# waits to be relayed. Eventuate's relay polls every 0.5 s.
poll_interval = 0.5
# Events relayed, or swept, at a time. Eventuate's relay reads 1000.
batch_size = 1000
# Seconds an event stays in its outbox and its stream once relayed, and a dead letter is
# kept: the longest a consumer may be away and still get every event. 7 days, Kafka's
# default.
retention = 604_800
# Seconds between two sweeps of what is past the retention.
sweep_interval = 3600
# Seconds the relay and the consumers wait after PostgreSQL or Redis failed them.
reconnect_delay = 5
# Seconds a consumer waits for a new event in one read, before it looks for retries again,
# or sees that it must stop: less than [redis] timeout, which would cut the read short.
read_wait = 2
# Seconds a handler may take; one that takes longer has failed. Less than retry_delay, so
# that no retry starts while the try before it may still run.
handler_timeout = 20
# Seconds before an event whose handler failed is tried again. Each retry waits twice as
# long as the one before, up to retry_delay_max: 6 hours.
retry_delay = 30
retry_delay_max = 21_600
# Deliveries an event gets before it is put aside as a dead letter: with the delays above,
# some 2.6 days of retries, so that an outage of a day or two loses nothing. Sidekiq retries
# for about 20 days before its dead set; the retention bounds ours.
max_deliveries = 20

[app_api]
# What the modules that serve ai-platform's app API share (platform/protocols/app/README.md,
# whose Settings these are).
#
# Seconds a retry with an Idempotency-Key gets the first answer: 24 hours.
idempotency_retention = 86_400
# How deep a body may nest its arrays and objects at most; deeper, the API answers that it
# is not JSON. RFC 8259 lets a reader limit it (section 9), and the protocol names no depth:
# its bodies nest a few levels. 64 is .NET's System.Text.Json default (JsonReaderOptions.
# MaxDepth). Python's json has a limit of its own, which the C stack sets: some 11,000 deep
# on Windows, more on Linux; this one is the same on every machine.
max_json_depth = 64

[accounts]
# Signing in, the account, and homes (ai-platform's app API:
# platform/protocols/app/README.md, whose Settings these are).
#
# The OAuth client IDs of the apps that may sign in.
client_ids = ["ai-app"]
# Seconds a nonce stays valid.
nonce_lifetime = 300
# Seconds an access token is valid. Ending a session takes effect at once, whatever it is.
access_lifetime = 600
# Seconds a session lasts unused: 90 days.
refresh_idle = 7_776_000
# Seconds after its first use within which a refresh token refreshes again, while the token
# that replaced it is unused: a retry after an answer lost on the way (ai-platform ADR-0011),
# as long as Okta's longest grace period.
refresh_reuse = 60
# Seconds since it was issued within which an ID token may delete its account or a home,
# or hand a home over.
recent_sign_in = 300
# How many homes an account may be in: as in Google Home.
homes_per_account = 5
# How many people a home may have, profiles included.
members_per_home = 30
# Seconds an invitation's code is valid: 3 days.
invitation_lifetime = 259_200
# How many open invitations a home may have.
invitations_per_home = 10

[accounts.invitation_rate]
# How many invitation codes one account may try: 10 a minute.
limit = 10
period = 60

[accounts.nonce_rate]
# How many nonces one address gets: 10 a minute.
limit = 10
period = 60
# The prefix by which IPv6 addresses count: one host is commonly given a whole /64.
ipv6_prefix = 64

[accounts.jwks]
# Fetching the keys Google and Apple publish for their ID tokens.
#
# Seconds to wait for them.
timeout = 10
# Seconds at least between two fetches, whatever tokens arrive and whatever the
# providers say.
refetch_interval = 60
# Seconds they are kept when the provider does not say how long.
default_max_age = 3600

[accounts.google]
# The project's Google client IDs that ID tokens may be issued to (their aud): none
# until the project has its Google Cloud project, and nobody signs in with Google.
client_ids = []

[accounts.development]
# The development provider, which signs test people in without Google or Apple (the app
# API's Development). Whoever reaches the api can then sign in as anyone: on in the
# development environment only.
enabled = false
# The issuer of its ID tokens.
issuer = "ai-cloud-development"
# The app its ID tokens are for: one of client_ids.
client_id = "ai-app"
# Seconds its ID tokens are valid.
id_token_lifetime = 600

[devices]
# A home's devices, and set-up's registration into one (ai-platform's app API:
# platform/protocols/app/README.md, whose Settings these are).
#
# server, the address that devices use to reach the cloud, is each deployment's: the
# development environment's file names this machine, and a deployment its own, in its
# local.toml. Without it, the cloud does not start.
#
# Seconds a challenge to register a device is valid: as long as AWS IoT's claim
# certificates.
challenge_lifetime = 300
# How many devices a home may have: as many as SmartThings allows in a location.
devices_per_home = 300
# Seconds a device's access token is valid, as the cloud link's example has it. It only opens
# the control channel, which may then last longer.
access_lifetime = 600

[devices.challenge_rate]
# How many challenges to register a device one account gets: 10 a minute.
limit = 10
period = 60

[devices.token_rate]
# How many access tokens one address may ask for: 60 a minute, so that a home's devices, which
# share its address, get theirs together after an outage.
limit = 60
period = 60
# The prefix by which IPv6 addresses count: one host is commonly given a whole /64.
ipv6_prefix = 64

[devices.link]
# The devices' control channels (the cloud link's Settings, and
# docs/decisions/0011-control-channels.md).
#
# Seconds the cloud waits for a device's hello: the cloud link's starting point.
hello_timeout = 5
# Seconds between a device's pings, which the cloud's hello gives: the cloud link's starting
# point. The cloud closes a connection from which nothing has come for two of them, or to
# which nothing could be sent for as long.
ping_interval = 20
# What the cloud takes from a device: 50 messages a second, in bursts of 100, and 500 more
# waiting their turn. The cloud link's starting points for what a device takes from the
# cloud, which sends it more than it gets.
rate = 50
burst = 100
backlog = 500
# How deep a device's message may nest its arrays and objects at most; deeper, the cloud
# cannot read it (REL-4). As [app_api] max_json_depth, and for its reasons: the cloud link
# names no depth, and its messages nest a few levels.
max_json_depth = 64
# Seconds between two checks of a replica's connections against the registry and the
# presence: the longest that a lost hint delays the bye of a device removed or replaced.
check_interval = 20
# Seconds a connection's presence lasts unless its replica keeps it, as Centrifugo's
# presence_ttl: three checks, so that one late or failed check loses nothing.
presence_ttl = 60
# Seconds the cloud waits, when it goes away, for each connection's reconnect to leave.
close_timeout = 5
