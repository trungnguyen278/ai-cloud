[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "ai-cloud"
version = "0.1.0"
description = "The cloud side of the project's AI devices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# The data and tokens' libraries are chosen in docs/decisions/0008-data-and-tokens.md.
dependencies = [
  "alembic>=1.20.1,<2",  # each module's migrations
  "asyncpg>=0.32,<1",  # PostgreSQL's driver
  "fastapi>=0.162,<1",  # the api process (docs/decisions/0002-stack.md)
  "httpx2>=2.16,<3",  # the providers' published keys; Starlette's test client
  "jsonschema>=4.26,<5",  # checking bodies against the protocols' schemas (SEC-14)
  "pydantic>=2.14,<3",  # the configuration's checks, and FastAPI's
  "pyjwt[crypto]>=2.15.1,<3",  # signing and verifying every token
  "redis>=8.1,<9",  # nonces, rate limits
  "sqlalchemy[asyncio]>=2.1.6,<2.2",  # its Core; a minor version may change behaviour
  "tzdata>=2026.6",  # the IANA time zones a home may name, the same on every host
  "uvicorn[standard]>=0.54,<1",  # serves the api
]

[project.scripts]
ai-cloud = "ai_cloud.__main__:main"

[dependency-groups]
dev = [
  "import-linter>=2.15,<3",  # the modules' boundaries (docs/decisions/0001-architecture.md)
  "pytest>=9.2,<10",
  "pyyaml>=6.0.3,<7",  # the tests read the images to run from the development Compose file
  "ruff>=0.17,<0.18",  # its rules change with each minor version
  "testcontainers>=4.15,<5",  # PostgreSQL and Redis for the tests, in Docker
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cloud"]

[tool.pytest]
minversion = "9.2"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
pythonpath = ["tests"]  # for the helpers the tests share, such as app_api.py
strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["platform"]  # ai-platform's code, checked in its own repository

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# The architecture's layers (docs/architecture.md, Modules): the process roles' entry
# points above everything, the modules in between, and shared beneath.
[tool.importlinter]
root_package = "ai_cloud"

[[tool.importlinter.contracts]]
name = "Layers: the entry points, then the modules, then shared"
type = "layers"
layers = ["ai_cloud.entry", "ai_cloud.devices", "ai_cloud.accounts", "ai_cloud.shared"]

# Outside a module, only its api.py.
[[tool.importlinter.contracts]]
name = "The accounts' insides are their own"
type = "protected"
protected_modules = [
  "ai_cloud.accounts.adapters",
  "ai_cloud.accounts.db",
  "ai_cloud.accounts.domain",
  "ai_cloud.accounts.ports",
  "ai_cloud.accounts.routes",
  "ai_cloud.accounts.service",
  "ai_cloud.accounts.settings",
]
allowed_importers = ["ai_cloud.accounts"]

[[tool.importlinter.contracts]]
name = "The devices' insides are their own"
type = "protected"
protected_modules = [
  "ai_cloud.devices.adapters",
  "ai_cloud.devices.db",
  "ai_cloud.devices.domain",
  "ai_cloud.devices.ports",
  "ai_cloud.devices.routes",
  "ai_cloud.devices.service",
  "ai_cloud.devices.settings",
]
allowed_importers = ["ai_cloud.devices"]

# A module writes its events and declares its consumers; only the worker relays and delivers
# them, so that the queue can change beneath the modules (docs/decisions/0009-domain-events.md).
[[tool.importlinter.contracts]]
name = "The modules know nothing of the events' queue"
type = "forbidden"
source_modules = ["ai_cloud.accounts", "ai_cloud.devices"]
forbidden_modules = [
  "ai_cloud.shared.events.consumers",
  "ai_cloud.shared.events.queue",
  "ai_cloud.shared.events.relay",
  "ai_cloud.shared.events.streams",
]

# Inside a module: its use cases and its adapters meet only through its ports, and its
# domain needs nothing but itself.
[[tool.importlinter.contracts]]
name = "A module's own layers"
type = "layers"
containers = ["ai_cloud.accounts", "ai_cloud.devices"]
layers = ["api", "routes", "service | adapters", "ports | db", "domain | settings"]
